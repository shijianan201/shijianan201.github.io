---
layout: app
---
{% assign product = site.data.apps[page.app] %}
<article class="app-document">
  <a class="app-document__product" href="{{ product.path | relative_url }}">
    <img src="{{ product.icon | relative_url }}" width="32" height="32" alt="">
    {{ product.name }}
  </a>
  {% if page.document_languages %}
  <details class="app-document__languages">
    <summary>Language / 语言</summary>
    <nav aria-label="Document language">
      {% for locale in page.document_languages %}
      <a href="#language-{{ locale }}">{{ site.data.i18n[locale].name | default: '繁體中文' }}</a>
      {% endfor %}
    </nav>
  </details>
  {% endif %}
  {{ content }}
</article>
