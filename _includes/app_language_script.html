<script>
  (() => {
    const routes = {
      en: {{ product.locales.en | relative_url | jsonify }},
      zh: {{ product.locales.zh | relative_url | jsonify }}
    };
    const current = {{ language_base | jsonify }};
    const preferenceKey = 'jannix-app-language';

    function browserLanguage() {
      const locales = navigator.languages?.length ? navigator.languages : [navigator.language];
      for (const locale of locales) {
        const language = locale?.toLowerCase().split('-')[0];
        if (language === 'zh' || language === 'en') return language;
      }
      return 'en';
    }

    function localizedUrl(language) {
      return routes[language] + location.search + location.hash;
    }

    {% if page.language_entry %}
    function preferredLanguage() {
      try {
        const language = localStorage.getItem(preferenceKey);
        if (language === 'zh' || language === 'en') return language;
      } catch {
        // The language links also work when storage is unavailable.
      }
      return browserLanguage();
    }

    const preferred = preferredLanguage();
    if (preferred !== current) {
      location.replace(localizedUrl(preferred));
      return;
    }
    {% endif %}

    document.addEventListener('DOMContentLoaded', () => {
      const picker = document.querySelector('.app-language');
      const options = picker.querySelectorAll('[data-app-language]');
      const automatic = picker.querySelector('[data-language-auto]');

      function updateLinks() {
        for (const option of options) {
          option.href = localizedUrl(option.dataset.appLanguage);
        }
      }

      updateLinks();
      window.addEventListener('hashchange', updateLinks);
      automatic.hidden = false;

      for (const option of options) {
        option.addEventListener('click', () => {
          try { localStorage.setItem(preferenceKey, option.dataset.appLanguage); } catch {}
        });
      }

      automatic.addEventListener('click', () => {
        try { localStorage.removeItem(preferenceKey); } catch {}
        const language = browserLanguage();
        if (language !== current) location.assign(localizedUrl(language));
        else picker.open = false;
      });

      picker.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && picker.open) {
          picker.open = false;
          picker.querySelector('summary').focus();
        }
      });

      document.addEventListener('click', (event) => {
        if (picker.open && !picker.contains(event.target)) picker.open = false;
      });
    });
  })();
</script>
