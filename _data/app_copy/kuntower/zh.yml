story:
  title: 游戏背景
  paragraphs:
  - 在神秘的<strong>「艾坤大陆」</strong>上，练习时长两年半的见习练习生坤坤，正一边唱跳一边练习他的纯金元气篮球。不料，嫉妒坤坤才华的邪恶黑粉魔王掳走了<strong>「鸡妹妹」</strong>，将这位全球后援会会长囚禁在 50 层魔塔的顶端。
  - 作为练习生的你，穿上标志性战袍背带裤，手持出道篮球，只身勇闯这片被黑粉与魔物占领的魔塔。
modes:
  title: 三大核心模式 · 算力与肉鸽并存
  description: 满足严谨卡防数值党、爽快暴击肉鸽党与登顶挑战极限党
  items:
  - badge: 经典模式
    title: 1:1 魔塔经典算法
    description: 严格遵从 50 层经典魔塔原版逻辑！无随机波动、零闪避暴击，100% 确定性路线规划，考验你每一步的卡防决策与钥匙资源配置。
    notes:
    - 纯物理与领域损耗：麻衣电击巫师(100)与红衣魔音大魔导(200)固定领域扣血
    - 准确损耗角标预演：所见即所得，拒绝随机性误伤
    - 经典道具与机关解密：圣光十字架、神圣剑盾与 24F 传送门
  - badge: 狂野模式
    title: 肉鸽暴击与修仙突破
    description: 打破传统数值束缚！怪物属性动态浮动，体验 11 阶修仙境界突破、18 项流派天赋自由组合与金光圣盾破防！
    notes:
    - 11 阶修仙境界突破（Lv.0 个人练习生 ~ Lv.10 坤之巅峰·至尊神王）
    - 六大肉鸽流派天赋（背带裤/跳/铁山靠/唱/Rap/篮球）
    - 全塔 15 只【沙包练习生】共生进化全歼隐藏成就
    - 狂野精英变异词缀（狂怒/铁壁/迅捷/宝藏）与金光圣盾抗伤
  - badge: 无尽幻境 & 51F
    title: 终极套房与极限挑战
    description: 突破传统 50 层魔塔界限！通关 50 层解锁神秘隐藏第 51 层 VIP 总统套房大结局与全宇宙无尽幻境榜单！
    notes:
    - 51F 全塔魔王和解毕业册：魔龙、红衣巫师、大章鱼集体“黑转粉”感人留言
    - 鸡妹妹常驻互动：喝生椰拿铁、吃华强保熟西瓜，揭晓最终出道大反转
    - 坤界无尽幻境：随机层数与遗物构筑，冲击全球极简步数榜
